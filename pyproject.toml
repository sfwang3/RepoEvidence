[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repoevidence"
version = "0.2.0"
description = "Local-first, evidence-backed repository understanding and runtime verification."
readme = "README.pypi.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "sfwang3" },
]
keywords = ["software-understanding", "evidence", "verification", "static-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.0",
    "defusedxml>=0.7.1",
    "tree-sitter>=0.25",
    "tree-sitter-java>=0.23",
    "typer>=0.12",
    "rich>=13.7",
    "mysql-connector-python>=9.0",
    "textual>=8.2,<9",
    "platformdirs>=4,<5",
]

[project.urls]
Homepage = "https://github.com/sfwang3/RepoEvidence"
Repository = "https://github.com/sfwang3/RepoEvidence"
Issues = "https://github.com/sfwang3/RepoEvidence/issues"
"简体中文文档" = "https://github.com/sfwang3/RepoEvidence/blob/main/README.zh-CN.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "build>=1.2",
    "twine>=5.0",
]

[project.scripts]
repoevidence = "repoevidence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
